name: Bug report
description: mcp-tracer behaves wrongly, or a generated script does not do what it should in Packet Tracer.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        - If a port name, model or cable behaves differently in Packet Tracer than the catalog says, use the **Port or model verification** form instead.
        - Problems installing or running PTBuilder itself (Builder.pts, the Builder Code Editor) belong in the [PTBuilder repository](https://github.com/kimmknight/PTBuilder/issues).

  - type: input
    id: version
    attributes:
      label: mcp-tracer version
      description: "Shown in the first line of every generated script (`Generated by mcp-tracer v…`) and in the server's log line `[mcp-tracer] info: v… running on stdio`."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: "Claude Desktop 1.x, Claude Code 2.x, Cursor 1.x…"
    validations:
      required: true

  - type: input
    id: packet-tracer
    attributes:
      label: Packet Tracer version
      description: Help > About in Packet Tracer. Leave empty if the bug happens before Packet Tracer is involved.
      placeholder: "9.0.0"

  - type: input
    id: ptbuilder
    attributes:
      label: PTBuilder version or commit
      description: The release or commit of `Builder.pts` you installed, or the date you downloaded it.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.x"

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A short description of the problem.
    validations:
      required: true

  - type: textarea
    id: tool-calls
    attributes:
      label: Tool calls or topology JSON
      description: The tool calls the agent made (tool name and arguments), or the output of `get_topology`, or a file written by `save_topology`.
      render: json
    validations:
      required: true

  - type: textarea
    id: script
    attributes:
      label: Generated script
      description: The script from `generate_script` or `export_script`, if the problem shows up in Packet Tracer.
      render: js

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, the `validate_config` output, and any Packet Tracer error box (for example "An error occurred on line N"). Screenshots help.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran the script in a new, empty Packet Tracer workspace (File > New), or the bug does not involve running a script.
        - label: I searched the existing issues.
          required: true
