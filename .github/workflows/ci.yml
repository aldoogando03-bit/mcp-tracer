name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22]
        include:
          # One Windows job: the stdio smoke test spawns the server, and the maintainer develops on Windows.
          - os: windows-latest
            node-version: 22
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Runs after the build so test/stdio.test.ts can spawn build/index.js; also type-checks the tests.
      - name: Test
        run: npm test

      - name: Check examples are up to date
        run: node scripts/build-examples.mjs --check

      - name: Check package contents
        run: npm pack --dry-run
